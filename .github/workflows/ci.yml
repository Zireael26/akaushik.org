name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel earlier in-progress runs for the same ref when a newer push lands,
# so a push-storm doesn't queue five of these against the same commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # pnpm/action-setup@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          standalone: true

      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unit suite + coverage floor (75/55/75 lines/branches/functions from
      # vitest.config.ts). Previously enforced only by the local pre-push hook,
      # which never fires on PRs merged via the GitHub UI/API — a green CI could
      # ship a broken lib/*.test.ts or a coverage regression.
      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Process-gate normally runs over *staged* changes via the pre-commit
      # hook. In CI we run it over the diff against main so structural drift
      # (next.config, package.json, etc. without an ADR/CHANGELOG reference)
      # gets caught even if someone bypassed the local hook.
      - name: Process gate (diff against main)
        if: github.event_name != 'push'
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          PROCESS_GATE_DIFF_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          pnpm process:check
