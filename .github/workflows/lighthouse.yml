name: Lighthouse + Axe

on:
  pull_request:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # pnpm/action-setup@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          standalone: true

      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Runner-local serve. Vercel GitHub auto-deploy has been unreliable
      # since 2026-04-24 (docs/gap-analysis-2026-05-19.md finding C2-b);
      # this job no longer waits on *.vercel.app. Build + start + wait-on +
      # audit against localhost.

      - name: Build (production)
        run: pnpm build

      - name: Start server
        run: |
          nohup pnpm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server ready
        run: pnpm exec wait-on http://localhost:3000 --timeout 60000

      - name: Lighthouse (desktop)
        # treosh/lighthouse-ci-action@v11
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/work/neev
            http://localhost:3000/writing
          configPath: ./lighthouserc.yml
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-results-desktop

      - name: Lighthouse (mobile)
        # treosh/lighthouse-ci-action@v11
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/work/neev
            http://localhost:3000/writing
          configPath: ./lighthouserc.mobile.yml
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-results-mobile

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli@4

      # Gate armed: home.spec.ts's WCAG axe test passes with 0 violations
      # (verified T5 audit remediation), so this step now fails the build
      # on regression instead of only reporting.
      - name: Axe-core scan
        run: |
          axe http://localhost:3000/ http://localhost:3000/work/neev http://localhost:3000/writing \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa

      - name: Stop server
        if: always()
        run: |
          if [[ -f server.pid ]]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Upload server log
        if: failure()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-log-${{ github.run_id }}
          path: server.log
          retention-days: 7
