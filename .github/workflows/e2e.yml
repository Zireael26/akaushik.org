name: E2E (Playwright)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # pnpm/action-setup@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          standalone: true

      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Runner-local serve. Vercel GitHub auto-deploy has been unreliable
      # since 2026-04-24 (docs/gap-analysis-2026-05-19.md finding C2-b);
      # this job no longer waits on *.vercel.app. Build + start + wait-on +
      # run tests against localhost.

      - name: Install Playwright browsers
        # All projects in playwright.config.ts: chromium-desktop, firefox-desktop,
        # webkit-desktop, webkit-mobile, chromium-tablet. Install all browsers
        # so every project can run.
        run: pnpm test:e2e:install

      - name: Build (production)
        run: pnpm build

      - name: Start server
        run: |
          nohup pnpm exec next start --port 3100 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server ready
        run: pnpm exec wait-on http://localhost:3100 --timeout 60000

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
        run: pnpm test:e2e

      - name: Stop server
        if: always()
        run: |
          if [[ -f server.pid ]]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Upload server log
        if: failure()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-log-${{ github.run_id }}
          path: server.log
          retention-days: 7
