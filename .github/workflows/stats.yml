name: Refresh GitHub stats

on:
  schedule:
    - cron: '17 4 * * *'      # Daily 04:17 UTC
  workflow_dispatch:        # also allow manual runs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Fetch stats
        env:
          # PAT with `read:user` + `repo` scope. Store as repo secret GH_STATS_TOKEN.
          # Falls back to the default GITHUB_TOKEN if you don't need private-repo coverage.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-stats.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/data/stats.json)" ]]; then
            git config user.name  "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git add public/data/stats.json
            git commit -m "chore(stats): daily refresh"
            git push
          else
            echo "No changes."
          fi
